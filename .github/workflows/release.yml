name: Release

# Push a tag like v1.2.0 to publish a release with flashable binaries.
# Tags with a suffix (v1.2.0-beta.1) become prereleases.
on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      actions: write # to start the Pages deploy

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Regenerate src/index_html.h so the firmware embeds the web UI of the tagged commit
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: 'frontend/.node-version'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Build web UI
        working-directory: ./frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm run build:firmware

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO Core and esptool
        run: pip install --upgrade platformio esptool==4.8.1

      - name: Build firmware
        run: pio run

      # Offsets match the esp32cam board (huge_app partitions, DIO flash at 40 MHz, 4 MB)
      - name: Collect binaries
        run: |
          name="fritzgate-$GITHUB_REF_NAME"
          build=.pio/build/esp32cam
          mkdir -p release
          cp "$build/bootloader.bin" "release/$name-bootloader.bin"
          cp "$build/partitions.bin" "release/$name-partitions.bin"
          cp ~/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin "release/$name-boot_app0.bin"
          cp "$build/firmware.bin" "release/$name-firmware.bin"

          # Single image for flashing at 0x0 with any tool
          esptool.py --chip esp32 merge_bin -o "release/$name-full.bin" \
            --flash_mode dio --flash_freq 40m --flash_size 4MB \
            0x1000 "release/$name-bootloader.bin" \
            0x8000 "release/$name-partitions.bin" \
            0xe000 "release/$name-boot_app0.bin" \
            0x10000 "release/$name-firmware.bin"

          # Manifest for ESP Web Tools, with the same offsets; the web installer serves it next to the parts
          cat > "release/$name-manifest.json" <<EOF
          {
            "name": "FritzGate",
            "version": "$GITHUB_REF_NAME",
            "new_install_prompt_erase": true,
            "new_install_improv_wait_time": 0,
            "builds": [
              {
                "chipFamily": "ESP32",
                "parts": [
                  { "path": "$name-bootloader.bin", "offset": 4096 },
                  { "path": "$name-partitions.bin", "offset": 32768 },
                  { "path": "$name-boot_app0.bin", "offset": 57344 },
                  { "path": "$name-firmware.bin", "offset": 65536 }
                ]
              }
            ]
          }
          EOF

          ls -l release

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          name="fritzgate-$GITHUB_REF_NAME"

          sed "s|@NAME@|$name|g" > "$RUNNER_TEMP/notes.md" <<'EOF'
          ### Flashing

          Connect the ESP32-CAM through an ESP32-CAM-MB adapter or a USB-to-serial adapter. The board has no USB port of its own.

          **New installation:** write the complete image to address `0x0`. This erases saved settings.

          ```bash
          esptool.py --chip esp32 write_flash 0x0 @NAME@-full.bin
          ```

          **Update:** write the four parts instead. This keeps the saved Wi-Fi, FRITZ!Box login and sensor bindings.

          ```bash
          esptool.py --chip esp32 write_flash 0x1000 @NAME@-bootloader.bin 0x8000 @NAME@-partitions.bin 0xe000 @NAME@-boot_app0.bin 0x10000 @NAME@-firmware.bin
          ```

          To flash without installing anything, open Espressif's [browser flasher](https://espressif.github.io/esptool-js/) in Chrome or Edge and add the same files and addresses.
          If the tool can't connect, hold IO0, press RST and release IO0 to put the board into download mode.

          | File | Address |
          |---|---|
          | `@NAME@-full.bin` | `0x0` |
          | `@NAME@-bootloader.bin` | `0x1000` |
          | `@NAME@-partitions.bin` | `0x8000` |
          | `@NAME@-boot_app0.bin` | `0xe000` |
          | `@NAME@-firmware.bin` | `0x10000` |

          EOF

          prerelease=""
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            prerelease="--prerelease"
          fi

          # The generated changelog is appended after the notes above
          gh release create "$GITHUB_REF_NAME" release/*.bin release/*.json $prerelease \
            --generate-notes --notes-file "$RUNNER_TEMP/notes.md"

      # The web installer offers the latest regular release. Releases created with the workflow token
      # don't start other workflows, so start the Pages deploy explicitly (on main, which may deploy).
      - name: Publish the firmware in the web installer
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run deploy.yml --ref main
